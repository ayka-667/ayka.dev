<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
  <title>Ayka.dev — Erreur</title>
  <link rel="icon" type="image/png" href="src/img/imp.webp" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #000000;
      --fg: #ffffff;
      --muted: #737373;
      --accent: #3b82f6;
      --accent-glow: #60a5fa;
      --purple: #8b5cf6;
      --cyan: #06b6d4;
      --card: #0a0a0a;
      --border: #1a1a1a;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      33% { transform: translate(30px, -30px) rotate(120deg); }
      66% { transform: translate(-20px, 20px) rotate(240deg); }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.6;
      overflow-x: hidden;
      position: relative;
      min-height: 100vh;
    }

    /* Orbes lumineux flottants */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.3;
      pointer-events: none;
      z-index: 0;
      will-change: transform;
    }

    .orb-1 {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
      top: -250px;
      left: -250px;
      animation: float 25s ease-in-out infinite;
    }

    .orb-2 {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, var(--purple) 0%, transparent 70%);
      bottom: -200px;
      right: -200px;
      animation: float 30s ease-in-out infinite reverse;
    }

    .orb-3 {
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, var(--cyan) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      animation: float 35s ease-in-out infinite;
    }

    /* Grille de fond */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(rgba(59, 130, 246, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59, 130, 246, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      z-index: 1;
      mask-image: radial-gradient(ellipse 80% 50% at 50% 50%, black 40%, transparent 100%);
    }

    /* Main content */
    main {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      position: relative;
      z-index: 2;
    }

    .error-container {
      max-width: 550px;
      width: 100%;
      background: rgba(10, 10, 10, 0.5);
      border: 1px solid var(--border);
      border-radius: 32px;
      padding: 48px 40px;
      backdrop-filter: blur(20px);
      box-shadow: 
        0 0 0 1px rgba(255, 255, 255, 0.05),
        0 32px 64px rgba(0, 0, 0, 0.6);
      animation: fadeInUp 0.8s ease-out;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .error-container::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.05), rgba(139, 92, 246, 0.05));
      opacity: 0.5;
    }

    .error-illustration {
      font-size: 80px;
      line-height: 1;
      margin-bottom: 20px;
      animation: pulse 3s ease-in-out infinite;
      position: relative;
      z-index: 1;
    }

    .error-code {
      font-size: 64px;
      font-weight: 900;
      background: linear-gradient(135deg, var(--accent), var(--purple), var(--cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.04em;
      margin-bottom: 12px;
      position: relative;
      z-index: 1;
    }

    .error-title {
      font-size: 28px;
      font-weight: 900;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
      position: relative;
      z-index: 1;
    }

    .error-desc {
      font-size: 16px;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 32px;
      max-width: 450px;
      margin-left: auto;
      margin-right: auto;
      position: relative;
      z-index: 1;
    }

    .btn {
      padding: 10px 20px;
      border-radius: 100px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .error-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 24px;
      position: relative;
      z-index: 1;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--purple));
      color: white;
      box-shadow: 0 12px 32px rgba(59, 130, 246, 0.4);
      position: relative;
      overflow: hidden;
    }

    .btn-primary::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--accent-glow), var(--cyan));
      opacity: 0;
      transition: opacity 0.3s;
    }

    .btn-primary:hover::before {
      opacity: 1;
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 20px 48px rgba(59, 130, 246, 0.5);
    }

    .btn span {
      position: relative;
      z-index: 1;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: var(--fg);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-3px);
    }

    .error-help {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 16px;
      position: relative;
      z-index: 1;
    }

    .error-trace {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      padding: 16px;
      border-radius: 12px;
      color: var(--muted);
      font-family: ui-monospace, 'SF Mono', Monaco, monospace;
      font-size: 13px;
      overflow: auto;
      max-height: 120px;
      text-align: left;
      position: relative;
      z-index: 1;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .error-container {
        padding: 32px 24px;
      }

      .error-illustration {
        font-size: 64px;
      }

      .error-code {
        font-size: 48px;
      }

      .error-title {
        font-size: 24px;
      }

      .error-desc {
        font-size: 15px;
      }

      .error-actions {
        flex-direction: column;
      }

      .btn {
        width: 100%;
        justify-content: center;
      }
    }

    html {
      scroll-behavior: smooth;
    }

    ::selection {
      background: var(--accent);
      color: white;
    }
  </style>
</head>
<body>
  <!-- Orbes lumineux -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <main role="main">
    <article class="error-container" aria-labelledby="errorTitle">
      <div class="error-illustration" aria-hidden="true">🛠️</div>
      <div class="error-code" id="errorCode">404</div>
      <h1 id="errorTitle" class="error-title">Page introuvable</h1>
      <div class="error-desc" id="errorDesc">
        La page que vous recherchez n'existe pas, a été déplacée ou le lien est incorrect. Vérifiez l'URL ou revenez à l'accueil.
      </div>
      
      <div class="error-actions" role="group" aria-label="Actions d'erreur">
        <a class="btn btn-primary" href="/" id="homeBtn">
          <span>Retour à l'accueil</span>
        </a>
        <button class="btn btn-secondary" id="retryBtn" type="button">
          <span>🔄 Réessayer</span>
        </button>
        <a class="btn btn-secondary" href="mailto:contact@ayka.dev?subject=Erreur%20sur%20site%20Ayka" id="reportBtn">
          <span>Signaler le problème</span>
        </a>
      </div>

      <div class="error-help">Besoin d'aide ? Tu peux réessayer, revenir à l'accueil, ou nous envoyer un message.</div>
      <div class="error-trace" id="trace" aria-live="polite">Trace : aucune information</div>
    </article>
  </main>

  <script>
    // Script pour personnaliser la page via query params
    (function(){
      const params = new URLSearchParams(location.search);
      const code = params.get('code') || '404';
      const message = params.get('message') || (code === '404' ? 'Page introuvable' : 'Erreur serveur');
      const trace = params.get('trace') || '';
      const desc = params.get('desc');

      document.getElementById('errorCode').textContent = code;
      document.getElementById('errorTitle').textContent = message;
      if (desc) document.getElementById('errorDesc').textContent = decodeURIComponent(desc);
      if (trace) document.getElementById('trace').textContent = decodeURIComponent(trace);
      else document.getElementById('trace').textContent = 'Aucune trace disponible.';

      // Bouton Réessayer : recharge la page
      document.getElementById('retryBtn').addEventListener('click', function(){
        location.reload();
      });
    })();
  </script>
</body>
</html>
