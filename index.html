<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vidéo en arrière-plan</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #000;
        }

        /* Vidéo d'arrière-plan */
        .background-video {
            position: fixed;

            /* On agrandit légèrement la vidéo pour éviter
               les bords visibles à cause du flou */
            top: -20px;
            left: -20px;

            width: calc(100% + 40px);
            height: calc(100% + 40px);

            object-fit: cover;

            /* Désactive le son de la vidéo */
            pointer-events: none;

            /* Effet flou */
            filter: blur(8px);

            z-index: -2;
        }

        /* Assombrit légèrement l'arrière-plan */
        .overlay {
            position: fixed;
            inset: 0;

            background: rgba(0, 0, 0, 0.25);

            z-index: -1;
        }

        /* Contenu de la page */
        .content {
            position: relative;

            width: 100%;
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            z-index: 1;
        }

        .content h1 {
            color: white;
            font-family: Arial, sans-serif;
            font-size: 48px;
            text-align: center;
        }
    </style>
</head>

<body>

    <!--
        VIDÉO D'ARRIÈRE-PLAN

        muted = aucun son provenant de vid.mp4
        autoplay = démarre automatiquement
        loop = recommence automatiquement
        playsinline = fonctionne correctement sur mobile
    -->
    <video
        class="background-video"
        autoplay
        muted
        loop
        playsinline
    >
        <source src="vid.mp4" type="video/mp4">

        Votre navigateur ne supporte pas la lecture vidéo.
    </video>


    <!-- Couche sombre au-dessus de la vidéo -->
    <div class="overlay"></div>


    <!--
        MUSIQUE

        La musique vient uniquement de ce fichier.
        Le son de vid.mp4 reste désactivé.
    -->
    <audio id="music" loop>
        <source src="videoplayback.m4a" type="audio/mp4">

        Votre navigateur ne supporte pas la lecture audio.
    </audio>


    <!-- Contenu de votre page -->
    <main class="content">
        <h1>Ma page</h1>
    </main>


    <script>
        const music = document.getElementById("music");

        /*
         * Les navigateurs empêchent généralement une musique
         * de démarrer automatiquement avec le son.
         *
         * On essaie d'abord de la lancer automatiquement.
         */
        window.addEventListener("load", () => {
            music.play().catch(() => {
                /*
                 * Si le navigateur bloque l'autoplay,
                 * on attend la première interaction de l'utilisateur.
                 */
            });
        });


        /*
         * Au premier clic, toucher ou appui sur une touche,
         * on démarre la musique.
         */
        const startMusic = () => {
            music.play().catch(() => {});
        };

        document.addEventListener("click", startMusic, { once: true });
        document.addEventListener("touchstart", startMusic, { once: true });
        document.addEventListener("keydown", startMusic, { once: true });
    </script>

</body>
</html>
